name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 22.19.0
            pi-version: locked
            label: ""
          - node-version: 24
            pi-version: locked
            label: ""
          - node-version: 22.19.0
            pi-version: 0.84.3
            label: " (Pi 0.84.3)"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        if: matrix.pi-version == 'locked'
        run: bun install --frozen-lockfile
      - name: Pin minimum supported Pi family
        if: matrix.pi-version != 'locked'
        env:
          PI_VERSION: ${{ matrix.pi-version }}
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const path = "package.json";
            const manifest = JSON.parse(readFileSync(path, "utf8"));
            const packages = ["agent-core", "ai", "client", "coding-agent", "protocol", "telemetry", "tui"]
              .map((name) => `@earendil-works/pi-${name}`);
            manifest.overrides = {
              ...manifest.overrides,
              ...Object.fromEntries(packages.map((name) => [name, process.env.PI_VERSION])),
            };
            writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          '
          bun install
          git restore package.json
      - name: Verify minimum supported Pi family
        if: matrix.pi-version != 'locked'
        env:
          EXPECTED_PI_VERSION: ${{ matrix.pi-version }}
        run: |
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            const packages = ["agent-core", "ai", "client", "coding-agent", "protocol", "telemetry", "tui"]
              .map((name) => `@earendil-works/pi-${name}`);
            const output = execFileSync("bun", ["pm", "ls", "--all"], { encoding: "utf8" });
            const resolved = [...output.matchAll(/(@earendil-works\/pi-(?:agent-core|ai|client|coding-agent|protocol|telemetry|tui))@(\d+\.\d+\.\d+)/g)]
              .map(([, name, version]) => ({ name, version }));
            const missing = packages.filter((name) => !resolved.some((entry) => entry.name === name));
            const mismatches = resolved.filter((entry) => entry.version !== process.env.EXPECTED_PI_VERSION);
            if (missing.length || mismatches.length) {
              throw new Error(`Expected the full Pi family at ${process.env.EXPECTED_PI_VERSION}; missing=${JSON.stringify(missing)} mismatches=${JSON.stringify(mismatches)}`);
            }
          '
      - run: bun run check
      - run: bun run test
      - name: Smoke-test Pi package discovery
        run: |
          agent_dir="$(mktemp -d)"
          trap 'rm -rf "$agent_dir"' EXIT
          PI_CODING_AGENT_DIR="$agent_dir" ./node_modules/.bin/pi install "$PWD"
          output="$(PI_CODING_AGENT_DIR="$agent_dir" ./node_modules/.bin/pi --offline --no-session --mode rpc </dev/null)"
          grep -q '"statusKey":"plan-mode"' <<<"$output"
          grep -q '"widgetKey":"session-tasks-panel"' <<<"$output"
      - name: Smoke-test packed extensions without optional peers
        run: |
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          mkdir "$root/app" "$root/agent"
          printf '{"private":true}\n' >"$root/app/package.json"
          npm pack --ignore-scripts --silent --pack-destination "$root" >/dev/null
          tarballs=("$root"/*.tgz)
          test "${#tarballs[@]}" -eq 1
          npm install --prefix "$root/app" --ignore-scripts --legacy-peer-deps --no-audit --no-fund "${tarballs[0]}"
          test ! -e "$root/app/node_modules/ioredis"
          package="$root/app/node_modules/@tt-a1i/openpi"
          PI_CODING_AGENT_DIR="$root/agent" ./node_modules/.bin/pi \
            --offline \
            --mode rpc \
            --no-extensions \
            --extension "$package/extensions/file-search/index.ts" \
            --extension "$package/extensions/git-info/index.ts" \
            </dev/null

  windows-background-terminals:
    name: Background terminals (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test Windows process lifecycle
        run: |
          $testPath = if (Test-Path "tests/extensions/background-terminals/manager.test.ts") {
            "tests/extensions/background-terminals/manager.test.ts"
          } else {
            "extensions/background-terminals/manager.test.ts"
          }
          node --test --experimental-strip-types $testPath
